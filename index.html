<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#453b8c">
<title>Living Word</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#191a2e;--card:#252549;--field:#1a1a35;--accent:#7c5cff;--tab:#2a2a55;--text:#ececf6;--muted:#9a9ab8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,system-ui,sans-serif;padding-bottom:40px}
header{background:#453b8c;text-align:center;padding:18px 12px 14px}
header h1{margin:0;font-size:1.8rem}
header p{margin:4px 0 0;color:#c9c4ee}
nav{display:flex;gap:12px;justify-content:center;padding:18px 0 6px}
nav button{background:var(--tab);color:var(--text);border:0;border-radius:10px;padding:12px 26px;font-size:1.05rem}
nav button.on{background:var(--accent)}
.card{background:var(--card);border-radius:18px;margin:16px 14px;padding:20px}
.card h2{margin:0 0 6px;font-size:1.6rem}
.hint{color:var(--muted);margin:0 0 12px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:14px 22px;font-size:1.1rem;margin:0 8px 8px 0}
.btn.rec{background:#d6336c}
input,textarea{width:100%;background:var(--field);color:var(--text);border:0;border-radius:10px;padding:14px;font:inherit;margin-bottom:12px}
textarea{resize:vertical;min-height:120px}
#tx{background:var(--field);border-radius:10px;min-height:190px;padding:14px;line-height:1.5;overflow-wrap:anywhere}
#tx i{color:var(--muted)}
.ref{color:#b9a8ff;text-decoration:underline;background:none;border:0;font:inherit;padding:0}
.v,.n{background:var(--field);border-radius:10px;padding:12px 14px;margin-top:10px}
.v b,.n b{color:#b9a8ff}
.v p,.n p{margin:6px 0 0;line-height:1.5;white-space:pre-wrap}
.x{float:right;background:none;border:0;color:var(--muted);font-size:1.1rem}
.empty{color:var(--muted)}
.view{display:none}.view.on{display:block}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<header><h1>📖 Living Word</h1><p>Sermon transcription • Scripture linking • Notes</p></header>
<nav>
  <button class="on" data-t="t">Transcribe</button>
  <button data-t="v">Verses</button>
  <button data-t="n">Notes</button>
</nav>

<section class="view on" id="t">
  <div class="card">
    <h2>🎙️ Live Transcription</h2>
    <p class="hint">Click record and speak — Bible references (e.g. "John 3:16") are auto-detected and linked.</p>
    <button class="btn" id="rec">► Start Recording</button><button class="btn" id="clr">🗑️ Clear</button>
    <div id="tx" aria-live="polite"></div>
  </div>
  <div class="card">
    <h2>✝️ Linked Verses</h2>
    <input id="q" placeholder="Or look up a verse, e.g. Psalm 23:1" enterkeyhint="search">
    <button class="btn" id="go">Look Up</button>
    <div id="lv"><p class="empty">No verses yet.</p></div>
  </div>
  <div class="card">
    <h2>📝 Sermon Notes</h2>
    <input id="title" placeholder="Sermon title">
    <textarea id="body" placeholder="Your notes..."></textarea>
    <button class="btn" id="save">💾 Save Note</button>
  </div>
</section>

<section class="view" id="v"><div class="card"><h2>✝️ Saved Verses</h2><div id="sv"></div></div></section>
<section class="view" id="n"><div class="card"><h2>📝 Saved Notes</h2><div id="sn"></div></div></section>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let verses=store.get('lw_verses',[]),notes=store.get('lw_notes',[]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* tabs */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
});

/* reference detection */
const BOOKS="Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|1 Samuel|2 Samuel|1 Kings|2 Kings|1 Chronicles|2 Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Song of Solomon|Song of Songs|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|1 Corinthians|2 Corinthians|Galatians|Ephesians|Philippians|Colossians|1 Thessalonians|2 Thessalonians|1 Timothy|2 Timothy|Titus|Philemon|Hebrews|James|1 Peter|2 Peter|1 John|2 John|3 John|Jude|Revelation";
const NUM={first:'1',second:'2',third:'3',i:'1',ii:'2',iii:'3'};
const RE=new RegExp("\\b(?:(1|2|3|first|second|third)\\s+)?("+BOOKS.replace(/\d /g,'')+")\\s+(?:chapter\\s+)?(\\d{1,3})(?:\\s*(?::|verses?|\\bv\\b)\\s*(\\d{1,3})(?:\\s*(?:-|–|to)\\s*(\\d{1,3}))?)?","gi");
function findRefs(text){
  const out=[];let m;RE.lastIndex=0;
  while((m=RE.exec(text))){
    const n=m[1]?(NUM[m[1].toLowerCase()]||m[1])+' ':'';
    let ref=n+m[2]+' '+m[3]+(m[4]?':'+m[4]+(m[5]?'-'+m[5]:''):'');
    out.push({ref,start:m.index,end:m.index+m[0].length});
  }
  return out;
}

/* verse lookup (bible-api.com, KJV) */
async function lookup(ref,quiet){
  const box=$('lv');
  if(!quiet)box.innerHTML='<p class="empty">Looking up '+esc(ref)+'…</p>';
  try{
    const r=await fetch('https://bible-api.com/'+encodeURIComponent(ref)+'?translation=kjv');
    if(!r.ok)throw 0;
    const d=await r.json();
    if(!d.text)throw 0;
    addVerse(d.reference,d.text.trim());
  }catch(e){
    if(!quiet)box.innerHTML='<p class="empty">Could not find "'+esc(ref)+'". Check the spelling and your internet connection.</p>';
  }
}
let session=[];
function addVerse(ref,text){
  if(!session.find(v=>v.ref===ref))session.unshift({ref,text});
  if(!verses.find(v=>v.ref===ref)){verses.unshift({ref,text});store.set('lw_verses',verses)}
  renderVerses();
}
function vhtml(v,del){return '<div class="v">'+(del?'<button class="x" data-ref="'+esc(v.ref)+'" aria-label="Delete verse">✕</button>':'')+'<b>'+esc(v.ref)+'</b> (KJV)<p>'+esc(v.text)+'</p></div>'}
function renderVerses(){
  $('lv').innerHTML=session.length?session.map(v=>vhtml(v)).join(''):'<p class="empty">No verses yet.</p>';
  $('sv').innerHTML=verses.length?verses.map(v=>vhtml(v,1)).join(''):'<p class="empty">Verses you look up or hear in a sermon are saved here.</p>';
}
$('sv').onclick=e=>{const r=e.target.dataset.ref;if(r){verses=verses.filter(v=>v.ref!==r);store.set('lw_verses',verses);renderVerses()}};
$('go').onclick=()=>{const q=$('q').value.trim();if(q){lookup(q);$('q').value=''}};
$('q').onkeydown=e=>{if(e.key==='Enter')$('go').click()};

/* transcription */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,on=false,finalText='',seen=new Set();
function renderTx(interim){
  const refs=findRefs(finalText);let html='',i=0;
  refs.forEach(r=>{html+=esc(finalText.slice(i,r.start))+'<button class="ref" data-ref="'+esc(r.ref)+'">'+esc(finalText.slice(r.start,r.end))+'</button>';i=r.end});
  html+=esc(finalText.slice(i));
  if(interim)html+=' <i>'+esc(interim)+'</i>';
  $('tx').innerHTML=html;
  $('tx').scrollTop=$('tx').scrollHeight;
}
$('tx').onclick=e=>{const r=e.target.dataset.ref;if(r)lookup(r)};
$('rec').onclick=()=>{
  if(!SR){$('tx').innerHTML='<i>Speech recognition is not supported in this browser. Open the app in Chrome on Android.</i>';return}
  if(on){on=false;rec.stop();return}
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';
  rec.onresult=ev=>{
    let interim='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const t=ev.results[i][0].transcript;
      if(ev.results[i].isFinal){
        finalText+=(finalText?' ':'')+t.trim();
        findRefs(t).forEach(r=>{if(!seen.has(r.ref)){seen.add(r.ref);lookup(r.ref,true)}});
      }else interim+=t;
    }
    renderTx(interim);
  };
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;$('tx').innerHTML='<i>Microphone access was blocked. Allow the microphone for this site and try again.</i>'}};
  rec.onend=()=>{if(on){try{rec.start()}catch(e){}}else{$('rec').textContent='► Start Recording';$('rec').classList.remove('rec')}};
  on=true;rec.start();$('rec').textContent='■ Stop Recording';$('rec').classList.add('rec');
};
$('clr').onclick=()=>{finalText='';seen.clear();renderTx('')};

/* notes */
function renderNotes(){
  $('sn').innerHTML=notes.length?notes.map((n,i)=>'<div class="n"><button class="x" data-i="'+i+'" aria-label="Delete note">✕</button><b>'+esc(n.title||'Untitled sermon')+'</b> <small class="empty">'+esc(n.date)+'</small><p>'+esc(n.body)+'</p></div>').join(''):'<p class="empty">No notes yet. Write one on the Transcribe tab and tap Save Note.</p>';
}
$('sn').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){notes.splice(+i,1);store.set('lw_notes',notes);renderNotes()}};
$('save').onclick=()=>{
  const title=$('title').value.trim(),body=$('body').value.trim();
  if(!title&&!body){$('body').focus();return}
  notes.unshift({title,body,date:new Date().toLocaleDateString()});
  store.set('lw_notes',notes);$('title').value='';$('body').value='';renderNotes();
  $('save').textContent='✅ Saved';setTimeout(()=>$('save').textContent='💾 Save Note',1500);
};

renderVerses();renderNotes();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
